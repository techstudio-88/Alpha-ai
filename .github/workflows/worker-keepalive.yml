name: Keep Alpha.ai worker awake

on:
  schedule:
    - cron: "7/10 * * * *"
  workflow_dispatch:

jobs:
  ping-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and trigger queue recovery
        run: |
          set -e
          curl --fail --show-error --silent --max-time 120 \
            -H "Cache-Control: no-cache" \
            https://alpha-ai-media-worker.onrender.com/health

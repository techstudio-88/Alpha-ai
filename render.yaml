services:
  - type: web
    name: alpha-ai-media-worker
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        value: https://gmgswfsajvkiqrpsnuvx.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: MEDIA_WORKER_SECRET
        generateValue: true
      - key: WHISPER_MODEL
        value: small
